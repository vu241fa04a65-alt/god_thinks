name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  backend-ci:
    name: Lint, Test, and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run lint (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          python -m pytest backend/tests/test_auth.py backend/tests/test_reports.py -v

      - name: Build Docker image
        run: |
          docker build -t crophealth-backend:latest -f backend/Dockerfile .
