apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crophealth-ingress
  namespace: crophealth
  labels:
    app.kubernetes.io/name: crophealth
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.crophealth.ai
      secretName: crophealth-tls-cert
  rules:
    - host: app.crophealth.ai
      http:
        paths:
          # Route API requests to FastAPI backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crophealth-backend
                port:
                  number: 8000
          # Route static image storage requests to backend
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: crophealth-backend
                port:
                  number: 8000
          # Route all other web traffic to React Nginx frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crophealth-frontend
                port:
                  number: 80
