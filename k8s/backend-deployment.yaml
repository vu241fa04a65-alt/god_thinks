apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crophealth-backend-storage-pvc
  namespace: crophealth
  labels:
    app.kubernetes.io/name: crophealth
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crophealth-backend
  namespace: crophealth
  labels:
    app.kubernetes.io/name: crophealth
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: crophealth
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crophealth
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: docker.io/crophealth/crophealth-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: crophealth-config
            - secretRef:
                name: crophealth-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: storage-volume
              mountPath: /app/backend/storage
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: crophealth-backend-storage-pvc
