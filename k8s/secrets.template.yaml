# ==============================================================================
# Kubernetes Secret Template
# Replace dummy placeholders or generate with:
#   kubectl create secret generic crophealth-secrets \
#     --from-literal=SECRET_KEY="<32-byte-secret>" \
#     --from-literal=DATABASE_URL="postgresql://user:pass@host:5432/dbname" \
#     --dry-run=client -o yaml > k8s/secrets.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: crophealth-secrets
  namespace: crophealth
  labels:
    app.kubernetes.io/name: crophealth
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database & Cache Connection Strings
  DATABASE_URL: "postgresql://postgres:change_this_password@postgres-service:5432/crophealth_db"
  REDIS_URL: "redis://redis-service:6379/0"

  # JWT Signing Secret (Minimum 32 bytes)
  SECRET_KEY: "replace-with-a-secure-random-32-byte-hex-string-for-production"

  # Third-Party Integrations
  TWILIO_ACCOUNT_SID: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  TWILIO_AUTH_TOKEN: "your_twilio_auth_token"
  TWILIO_PHONE_NUMBER: "+1234567890"

  # External AI and Forecasting APIs
  GOOGLE_TRANSLATE_API_KEY: "AIzaSy..."
  OPENWEATHER_API_KEY: "your_openweather_api_key"
  GEMINI_API_KEY: "AIzaSy..."

  # AWS S3 / Cloud Storage Credentials (Optional)
  S3_BUCKET_NAME: "crophealth-leaf-storage"
  AWS_ACCESS_KEY_ID: "AKIA..."
  AWS_SECRET_ACCESS_KEY: "secret_access_key"
